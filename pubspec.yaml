name: safeher
description: "SafeHer – Because Every Woman Deserves to Feel Safe"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.5.1
  cupertino_icons: ^1.0.8
  logger: ^2.5.0
  file_picker: ^9.1.0
  firebase_storage: ^12.4.4
  audioplayers: ^6.4.0
  permission_handler: ^11.4.0
  just_audio: ^0.9.46
  geolocator: ^11.0.0
  cloud_functions: ^5.3.4
  vibration: ^1.7.0
  torch_light: ^1.1.0
  url_launcher: ^6.3.1
  video_player: ^2.9.5
  geocoding: ^3.0.0
  sensors_plus: ^6.1.1
  firebase_app_check: ^0.3.2+5
  flutter_launcher_icons: ^0.14.3

  
  


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/danger_alarm.mp3
    - assets/video/splash_video.mp4

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: "assets/icons/playstore_SafeHer_icon.png"
  image_path_ios: "assets/icons/appstore_Safeher_icon.png"

